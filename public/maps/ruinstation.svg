<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="ttl">
  <title id="ttl">Ruin Station — contested zone plan</title>

  <style>
    text{font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;fill:#150F0A}
    .t-lg{font-size:16px;font-weight:700;letter-spacing:.08em}
    .t{font-size:11px;font-weight:700;letter-spacing:.08em}
    .t-sm{font-size:9.5px;font-weight:700;letter-spacing:.07em}
    .t-xs{font-size:8px;font-weight:700;letter-spacing:.06em}
    .dim{fill:rgba(21,15,10,.6)}
    .cream{fill:#FBE9C8}
    .rm{fill:rgba(21,15,10,.07);stroke:#150F0A;stroke-width:1.3}
    .rm2{fill:rgba(21,15,10,.15);stroke:#150F0A;stroke-width:1.3}
    .hair{stroke:rgba(21,15,10,.3);stroke-width:1;fill:none}
    .p{fill:none;stroke:#150F0A;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
    .k-timer{fill:none;stroke:#FBE9C8;stroke-width:2;stroke-dasharray:2.5 3.5}
    .k-uniq{fill:none;stroke:#FBE9C8;stroke-width:2.2;stroke-dasharray:.1 5.5;stroke-linecap:round}
  </style>

  <defs>
    <g id="obj"><path d="M0,-8 8,0 0,8 -8,0Z" fill="#FBE9C8" stroke="#150F0A" stroke-width="1.6"/></g>
    <g id="bolt"><path d="M1.8,-3.6 -2.2,.6 0,.6 -1.8,3.6 2.2,-.6 0,-.6Z" fill="#FBE9C8"/></g>
    <g id="fdoor"><circle r="6" fill="#150F0A"/><use href="#bolt"/></g>
    <g id="fspawn"><rect x="-6" y="-6" width="12" height="12" fill="#150F0A"/><use href="#bolt"/></g>
    <g id="print"><rect x="-6.5" y="-5.5" width="13" height="11" fill="#FBE9C8" stroke="#150F0A" stroke-width="1.4"/><path d="M-3.5,-2h7M-3.5,0h7M-3.5,2h7" stroke="#150F0A" stroke-width="1.1"/></g>
    <g id="extr"><circle r="6.5" fill="#150F0A"/><path d="M0,-4 3,-1 -3,-1Z M0,4 3,1 -3,1Z" fill="#FBE9C8"/></g>
    <g id="frgt"><circle r="6.5" fill="#150F0A"/><rect x="-3.2" y="-3" width="6.4" height="6" fill="#FBE9C8"/></g>
    <g id="lock"><rect x="-1.2" y="-7" width="2.4" height="14" fill="#150F0A"/></g>
    <g id="arrow"><path d="M-5,-5.5 5.5,0 -5,5.5Z" fill="#150F0A"/></g>
  </defs>

  <!-- ============ LEGEND COLUMN ============ -->
  <g>
    <text class="t-lg" x="24" y="30">RUIN STATION</text>
    <text class="t-xs dim" x="24" y="44">CONTESTED ZONE — SECTOR PLAN</text>
    <path class="hair" d="M24,54H160"/>

    <use href="#obj" x="32" y="72"/><text class="t-sm" x="48" y="75.5">OBJECTIVE</text>
    <use href="#fspawn" x="32" y="92"/><text class="t-sm" x="48" y="95.5">FUSE SPAWNER</text>
    <use href="#fdoor" x="32" y="112"/><text class="t-sm" x="48" y="115.5">FUSE DOOR</text>
    <use href="#print" x="32" y="132"/><text class="t-sm" x="48" y="135.5">CARD PRINTER</text>
    <use href="#lock" x="32" y="152"/><text class="t-sm" x="48" y="155.5">SPAWN LOCKER</text>
    <use href="#extr" x="32" y="172"/><text class="t-sm" x="48" y="175.5">EXTRACT ELEVATOR</text>
    <use href="#frgt" x="32" y="192"/><text class="t-sm" x="48" y="195.5">FREIGHT ELEVATOR</text>
    <use href="#arrow" x="32" y="212"/><text class="t-sm" x="48" y="215.5">ONE-WAY DOOR</text>

    <path class="hair" d="M24,228H160"/>

    <path class="p" d="M24,246H44"/><text class="t-sm" x="52" y="249.5">FREE PATH</text>
    <path class="p" d="M24,266H44"/><path class="k-timer" d="M24,266H44"/><text class="t-sm" x="52" y="269.5">OPENS ON A TIMER</text>
    <path class="p" d="M24,286H44"/><path class="k-uniq" d="M24,286H44"/><text class="t-sm" x="52" y="289.5">UNIQUE KEY PATH</text>

    <path class="hair" d="M24,306H160"/>
    <text class="t-sm" x="24" y="324">UNIQUE KEYS</text>
    <text class="t-xs dim" x="24" y="338">WASTELAND · LAST RESORT</text>
    <text class="t-xs dim" x="24" y="350">CRYPT — PRINTED ON SITE</text>

    <path class="hair" d="M24,366H160"/>
    <text class="t-sm" x="24" y="384">SPAWN INDEX</text>
    <rect class="rm2" x="24" y="392" width="136" height="16"/>
    <text class="t-xs" x="32" y="403">FIRERATS · SITEWIDE</text>
    <rect class="rm2" x="24" y="412" width="136" height="16"/>
    <text class="t-xs" x="32" y="423">KOPION · SITEWIDE</text>

    <text class="t-xs dim" x="24" y="500">MAP DATA</text>
    <text class="t-xs dim" x="24" y="512">u/ZANE_DRAGONBORN</text>
    <path class="hair" d="M175,20V520"/>
  </g>

  <!-- ============ PLAN ============ -->
  <g>
    <!-- the vault -->
    <rect class="rm" x="436" y="58" width="90" height="95"/>
    <rect class="rm2" x="448" y="68" width="66" height="34"/>
    <rect class="rm2" x="448" y="112" width="66" height="32"/>
    <!-- the keyed cross -->
    <rect class="rm" x="520" y="112" width="46" height="46"/>
    <rect class="rm2" x="530" y="122" width="26" height="26"/>

    <!-- north corridor, gate B -->
    <rect class="rm" x="330" y="60" width="22" height="150"/>
    <rect class="rm" x="298" y="88" width="32" height="62"/>
    <rect class="rm" x="352" y="118" width="34" height="42"/>
    <rect class="rm" x="392" y="194" width="42" height="32"/>

    <!-- central hub -->
    <rect class="rm" x="408" y="242" width="94" height="84"/>
    <rect class="rm2" x="418" y="252" width="34" height="30"/>
    <rect class="rm2" x="240" y="246" width="100" height="20"/>

    <!-- the last resort -->
    <rect class="rm" x="278" y="264" width="52" height="46"/>
    <rect class="rm" x="286" y="318" width="40" height="54"/>
    <rect class="rm" x="196" y="320" width="62" height="34"/>
    <rect class="rm" x="306" y="400" width="62" height="46"/>
    <rect class="rm" x="230" y="436" width="64" height="34"/>

    <!-- the crypt -->
    <rect class="rm" x="356" y="376" width="62" height="60"/>
    <rect class="rm" x="398" y="416" width="46" height="34"/>
    <rect class="rm" x="358" y="462" width="56" height="42"/>

    <!-- the wasteland -->
    <rect class="rm" x="488" y="264" width="62" height="34"/>
    <rect class="rm" x="580" y="210" width="54" height="44"/>
    <rect class="rm" x="636" y="262" width="126" height="42"/>
    <rect class="rm2" x="650" y="272" width="44" height="24"/>
    <rect class="rm" x="756" y="300" width="62" height="46"/>
    <rect class="rm" x="594" y="328" width="62" height="26"/>
    <rect class="rm" x="618" y="366" width="62" height="32"/>

    <!-- free-path network -->
    <path class="p" d="M340,49V209H413V252L452,282 M230,255H452 M452,282H746L781,318V330
                       M606,282V230 M452,282V394H386V489 M386,432H410
                       M452,282H304V395L332,424V453H262
                       M304,336H212 M663,392H604V340H536V282"/>
    <circle cx="340" cy="49" r="5" fill="#150F0A"/>
    <circle cx="230" cy="255" r="5" fill="#150F0A"/>
    <circle cx="663" cy="392" r="5" fill="#150F0A"/>
    <circle cx="452" cy="282" r="13" fill="#150F0A"/>

    <!-- timer-locked path into the vault -->
    <path class="p" d="M485,58V153H450V273 M485,135H528 M485,153V172"/>
    <path class="k-timer" d="M485,58V153H450V273 M485,135H528"/>

    <!-- unique-key cross -->
    <path class="p" d="M541,95V185 M528,135H600"/>
    <path class="k-uniq" d="M541,95V185 M528,135H600"/>
    <circle cx="541" cy="95" r="4.5" fill="#150F0A"/>
    <circle cx="600" cy="135" r="4.5" fill="#150F0A"/>

    <!-- door plates -->
    <rect x="450" y="228" width="60" height="13" fill="#150F0A"/>
    <text class="t-xs cream" x="480" y="238" text-anchor="middle">TIMER DOOR</text>
    <rect x="512" y="88" width="58" height="12" fill="#150F0A"/>
    <text class="t-xs cream" x="541" y="97.5" text-anchor="middle">WASTELAND</text>
    <rect x="556" y="118" width="62" height="12" fill="#150F0A"/>
    <text class="t-xs cream" x="587" y="127.5" text-anchor="middle">LAST RESORT</text>
    <rect x="514" y="158" width="54" height="12" fill="#150F0A"/>
    <text class="t-xs cream" x="541" y="167.5" text-anchor="middle">CRYPT DOOR</text>

    <!-- objectives -->
    <use href="#obj" x="471" y="128"/>
    <path class="hair" d="M463,126 415,72"/>
    <text class="t" x="412" y="70" text-anchor="end">TABLET 6</text>
    <use href="#obj" x="541" y="190"/>
    <text class="t" x="556" y="194">TABLET 5</text>

    <!-- fixtures -->
    <use href="#frgt" x="483" y="52"/>
    <use href="#extr" x="485" y="176"/>
    <use href="#extr" x="606" y="230"/>
    <use href="#extr" x="212" y="337"/>
    <use href="#extr" x="386" y="489"/>

    <use href="#print" x="781" y="330"/>
    <use href="#print" x="262" y="453"/>
    <use href="#print" x="418" y="432"/>

    <use href="#fdoor" x="377" y="282"/>
    <use href="#fdoor" x="505" y="282"/>
    <use href="#fdoor" x="452" y="318"/>

    <use href="#arrow" transform="translate(340,184) rotate(90)"/>
    <use href="#arrow" transform="translate(374,209)"/>
    <use href="#arrow" transform="translate(316,255)"/>
    <use href="#arrow" transform="translate(376,255)"/>
    <use href="#arrow" transform="translate(536,340) rotate(180)"/>

    <use href="#lock" x="344" y="96"/>
    <use href="#lock" x="462" y="120"/>

    <!-- callouts -->
    <text class="t" x="481" y="42" text-anchor="middle">THE VAULT</text>
    <text class="t" x="765" y="216" text-anchor="middle">THE WASTELAND</text>
    <text class="t" x="250" y="412" text-anchor="middle">THE LAST RESORT</text>
    <text class="t" x="440" y="512" text-anchor="middle">THE CRYPT</text>

    <text class="t-sm" x="340" y="38" text-anchor="middle">GATE B &gt; ACCESS B</text>
    <text class="t-sm" x="248" y="244" text-anchor="middle">GATE A &gt; ACCESS A</text>
    <text class="t-sm" x="671" y="395">GATE C &gt; ACCESS C</text>

    <text class="t-sm dim" x="606" y="216" text-anchor="middle">EXTRACT</text>
    <text class="t-sm dim" x="212" y="354" text-anchor="middle">EXTRACT</text>
    <text class="t-sm dim" x="374" y="492" text-anchor="end">EXTRACT</text>
    <text class="t-xs dim" x="781" y="348" text-anchor="middle">WASTELAND KEY</text>
    <text class="t-xs dim" x="262" y="470" text-anchor="middle">LAST RESORT KEY</text>
    <text class="t-xs dim" x="418" y="452" text-anchor="middle">CRYPT KEY</text>
  </g>
</svg>
